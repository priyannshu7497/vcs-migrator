version: "3.9"

services:
  api:
    build: .
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis

  worker:
    build: .
    working_dir: /app
    command: celery -A app.workers.migration_worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
