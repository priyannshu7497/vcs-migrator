version: "3.9"

services:
  api:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: celery -A app.workers.migration_worker worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
